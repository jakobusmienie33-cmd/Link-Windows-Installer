name: Windows installer source validation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate source and branding
        shell: pwsh
        run: .\scripts\validate-source.ps1
      - name: Restore
        run: dotnet restore .\Link.Windows.Installer.sln
      - name: Build
        run: dotnet build .\Link.Windows.Installer.sln -c Debug --no-restore
